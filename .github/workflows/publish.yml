name: Publish npm package
run-name: publish-${{ inputs.version }}.${{ inputs.build_number }}-${{ inputs.build_type }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version prefix from Jenkins (MAJOR.MINOR)'
        required: true
        type: string
      build_number:
        description: 'Jenkins BUILD_NUMBER (preserves existing package versions)'
        required: true
        type: string
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options: [nightly, rc, release]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.22.3'
          package-manager-cache: false

      - name: Set package version
        id: version
        env:
          VERSION_PREFIX: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_TYPE: ${{ inputs.build_type }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_PREFIX" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'version must be MAJOR.MINOR'; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'build_number must be a positive integer'; exit 1; }
          case "$BUILD_TYPE" in
            release) package_version="$VERSION_PREFIX.$BUILD_NUMBER"; tag=latest ;;
            nightly|rc) package_version="$VERSION_PREFIX.$BUILD_NUMBER-$BUILD_TYPE"; tag="$BUILD_TYPE" ;;
            *) echo 'Unsupported build_type'; exit 1 ;;
          esac
          npm --no-git-tag-version --allow-same-version version "$package_version"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Publish using npm Trusted Publishing
        env:
          DIST_TAG: ${{ steps.version.outputs.tag }}
        run: npm publish --access public --tag "$DIST_TAG" --registry https://registry.npmjs.org

  release:
    if: inputs.build_type == 'release'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: v${{ needs.publish.outputs.version }}
          name: ${{ needs.publish.outputs.version }}
          target_commitish: ${{ github.sha }}
